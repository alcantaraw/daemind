services:
  ollama:
    image: 'ollama/ollama:latest'
    container_name: '${PREFIXO_CONTAINER}_ollama'
    restart: unless-stopped
    networks:
      instancia_net:
        ipv4_address: ${IP_OLLAMA}
        aliases:
          - ollama
    deploy:
      resources:
        limits:
          cpus: '${CPU_OLLAMA:-1.0}'
          memory: '${MEM_OLLAMA:-2048M}'
        reservations:
          memory: '${RES_OLLAMA:-512M}'
    environment:
      - TZ=America/Sao_Paulo
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_DEBUG=false
      - OLLAMA_DEBUG_LOG_REQUESTS=false
      - GIN_MODE=release
    volumes:
      - './volumes/ollama_models:/root/.ollama'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  caddy:
    ports:
      - "${HOST_OLLAMA_PORT:-11434}:11434/tcp" # Ollama API
