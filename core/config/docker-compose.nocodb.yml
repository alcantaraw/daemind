services:
  nocodb:
    image: 'nocodb/nocodb:latest'
    container_name: '${PREFIXO_CONTAINER}_nocodb'
    networks:
      instancia_net:
        ipv4_address: ${IP_NOCODB}
        aliases:
          - nocodb
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_NOCODB:-1.5}'
          memory: '${MEM_NOCODB:-1024M}'
        reservations:
          memory: '${RES_NOCODB:-256M}'
    environment:
      - TZ=America/Sao_Paulo
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_DEFAULT:-768} --no-deprecation
      - NC_DISABLE_TELE=true
      - NC_LOGGER_LEVEL=error
      - NC_CONNECT_TO_EXTERNAL_DB_DISABLED=false
      - NC_DB=pg://postgres:5432?u=${DB_USER}&p=${DB_PASSWORD}&d=${DB_NAME}&sslmode=disable&searchPath=nocodb_schema
      - NC_ADMIN_EMAIL=${TS_EMAIL}
      - NC_ADMIN_PASSWORD=${DB_PASSWORD}
      - NC_SESSION_EXPIRY=24h
      - NC_ALLOWED_IP_RANGES=private
      - NC_ALLOW_LOCAL_EXTERNAL_DBS=true
      - NC_DB_POOL_SIZE=20
      - NC_STORAGE_TYPE=${NOCODB_STORAGE_TYPE:-local}
      - NC_S3_ACCESS_KEY=${S3_ACCESS_KEY_ID:-${TS_EMAIL}}
      - NC_S3_ACCESS_SECRET=${S3_SECRET_ACCESS_KEY:-${DB_PASSWORD}}
      - NC_S3_BUCKET_NAME=${S3_NOCODB_BUCKET:-nocodb}
      - NC_S3_REGION=${S3_REGION:-us-east-1}
      - NC_S3_ENDPOINT=${S3_ENDPOINT:-http://s3minio:9000}
      - NC_S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - './volumes/nocodb_data:/usr/app/data/'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  caddy:
    ports:
      - "${HOST_NOCODB_PORT:-18080}:${HOST_NOCODB_PORT:-18080}/tcp" # NocoDB
