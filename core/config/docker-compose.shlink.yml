services:
  shlink:
    image: 'shlinkio/shlink:stable'
    container_name: '${PREFIXO_CONTAINER}_shlink'
    networks:
      instancia_net:
        ipv4_address: ${IP_SHLINK}
        aliases:
          - shlink
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_SHLINK:-1.0}'
          memory: '${MEM_SHLINK:-512M}'
        reservations:
          memory: '${RES_SHLINK:-128M}'
    environment:
      - TZ=America/Sao_Paulo
      - DEFAULT_DOMAIN=${SHLINK_DEFAULT_DOMAIN:-${TS_DOMAIN:-localhost}}
      - IS_HTTPS_ENABLED=false
      - GEOLITE_LICENSE_KEY=${GEOLITE_LICENSE_KEY:-}
      - DB_DRIVER=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_NAME=shlink_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_SERVERS=redis://redis:6379?database=2
      - INITIAL_API_KEY=${SHLINK_API_KEY:-${DB_PASSWORD}}
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/rest/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  shlink-web:
    image: 'shlinkio/shlink-web-client:latest'
    container_name: '${PREFIXO_CONTAINER}_shlink_web'
    networks:
      instancia_net:
        ipv4_address: ${IP_SHLINK_WEB}
        aliases:
          - shlink-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_SHLINK_WEB:-1.0}'
          memory: '128M'
        reservations:
          memory: '32M'
    environment:
      - SHLINK_SERVER_URL=http://${TS_DOMAIN:-localhost}:${HOST_SHLINK_PORT:-8081}
      - SHLINK_SERVER_NAME=${CLIENTE_EMPRESA:-${PREFIXO_CONTAINER}} Links
      - SHLINK_SERVER_API_KEY=${SHLINK_API_KEY:-${DB_PASSWORD}}
    depends_on:
      - shlink
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  caddy:
    ports:
      - "${HOST_SHLINK_PORT:-8081}:8081/tcp"
      - "${HOST_SHLINK_WEB_PORT:-8082}:8082/tcp"
