services:
  listmonk:
    image: 'listmonk/listmonk:latest'
    container_name: '${PREFIXO_CONTAINER}_listmonk'
    networks:
      instancia_net:
        ipv4_address: ${IP_LISTMONK}
        aliases:
          - listmonk
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_LISTMONK:-0.5}'
          memory: '${MEM_LISTMONK:-512M}'
        reservations:
          memory: '${RES_LISTMONK:-128M}'
    environment:
      - TZ=America/Sao_Paulo
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_app__log_level=error
      - LISTMONK_db__host=pgbouncer
      - LISTMONK_db__port=6432
      - LISTMONK_db__user=${DB_USER}
      - LISTMONK_db__password=${DB_PASSWORD}
      - LISTMONK_db__database=listmonk_db
      - LISTMONK_db__ssl_mode=disable
      - LISTMONK_db__max_open=25
      - LISTMONK_db__max_idle=5
      - LISTMONK_db__max_lifetime=300s
    volumes:
      - './volumes/listmonk_data:/listmonk/uploads'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    ports:
      - "${HOST_LISTMONK_PORT:-9005}:9005/tcp"
