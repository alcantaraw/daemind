services:
  docling:
    image: 'quay.io/docling-project/docling-serve-cpu:latest'
    container_name: '${PREFIXO_CONTAINER}_docling'
    networks:
      instancia_net:
        ipv4_address: ${IP_DOCLING}
        aliases:
          - docling
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_DOCLING:-1.0}'
          memory: '${MEM_DOCLING:-2048M}'
        reservations:
          memory: '${RES_DOCLING:-512M}'
    environment:
      - TZ=America/Sao_Paulo
      - PORT=5001
      - HOST=0.0.0.0
      - DOCLING_SERVE_PORT=5001
      - DOCLING_SERVE_HOST=0.0.0.0
      - DOCLING_SERVE_WORKERS_PER_CORE=1
      - DOCLING_SERVE_LOG_LEVEL=warning
      - DOCLING_SERVE_MAX_FILE_SIZE_MB=50
      - DOCLING_SERVE_TIMEOUT=300
      - DOCLING_SERVE_ENABLE_UI=true
      - UVICORN_LOG_LEVEL=warning
    volumes:
      - './volumes/docling_data:/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://127.0.0.1:5001/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    ports:
      - "${HOST_DOCLING_PORT:-5001}:5001/tcp" # Docling OCR / Doc Parsing API
