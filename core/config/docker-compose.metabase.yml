services:
  metabase:
    image: 'metabase/metabase:latest'
    container_name: '${PREFIXO_CONTAINER}_metabase'
    restart: unless-stopped
    networks:
      instancia_net:
        ipv4_address: ${IP_METABASE}
        aliases:
          - metabase
    deploy:
      resources:
        limits:
          cpus: '${CPU_METABASE:-2.0}'
          memory: '${MEM_METABASE:-2048M}'
        reservations:
          memory: '${RES_METABASE:-256M}'
    environment:
      - TZ=America/Sao_Paulo
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_db
      - MB_DB_PORT=5432
      - MB_DB_USER=${DB_USER:-admin_db}
      - MB_DB_PASS=${DB_PASSWORD}
      - MB_DB_HOST=postgres
      - MB_JETTY_PORT=3000
      - MB_ANON_TRACKING_ENABLED=false
      - MB_CHECK_FOR_UPDATES=false
      - MB_ENABLE_METABOT=false
      - MB_EMOJI_IN_LOGS=false
      - MB_LOG_LEVEL=ERROR
      - MB_SESSION_SECRET_KEY=${METABASE_SECRET_KEY:-${DB_PASSWORD}${DB_PASSWORD}}
      - JAVA_OPTS=-XX:+UseG1GC -Xms256m -Xmx768m -XX:MaxMetaspaceSize=512m -XX:+ExitOnOutOfMemoryError -Duser.timezone=America/Sao_Paulo -Dlog4j.configurationFile=file:/etc/metabase/log4j2.xml -Dlog4j2.level=WARN -Dorg.slf4j.simpleLogger.defaultLogLevel=warn
      # --- INTEGRAÇÃO COM IA SOBERANA (LITELLM PROXY / TEXT-TO-SQL) ---
      - MB_OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - MB_OPENAI_BASE_URL=http://litellm:4000
      - MB_OPENAI_MODEL=${METABASE_AI_MODEL:-gpt-4.1}
    volumes:
      - './core/config/log4j2.metabase.xml:/etc/metabase/log4j2.xml:ro'
      - './volumes/metabase_data:/metabase-data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://127.0.0.1:3000/api/health | grep -q 'ok' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  caddy:
    ports:
      - "${HOST_METABASE_PORT:-3030}:3030/tcp" # Metabase BI Console
