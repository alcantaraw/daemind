services:
  umami:
    image: 'ghcr.io/umami-software/umami:postgresql-latest'
    container_name: '${PREFIXO_CONTAINER}_umami'
    networks:
      instancia_net:
        ipv4_address: ${IP_UMAMI}
        aliases:
          - umami
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_UMAMI:-0.5}'
          memory: '${MEM_UMAMI:-512M}'
        reservations:
          memory: '${RES_UMAMI:-128M}'
    environment:
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/umami_db?sslmode=disable
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-${DB_PASSWORD}}
      - DISABLE_TELEMETRY=1
      - DISABLE_UPDATES=1
      - PORT=3000
    volumes:
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    ports:
      - "${HOST_UMAMI_PORT:-3008}:3008/tcp"
