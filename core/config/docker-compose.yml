networks:
  instancia_net:
    name: '${PREFIXO_CONTAINER}_net'
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-${PREFIXO_CONTAINER}
    ipam:
      config:
        - subnet: ${IP_NETWORK_SUBNET}

services:
  redis:
    image: 'redis:7.4-alpine'
    container_name: '${PREFIXO_CONTAINER}_redis'
    command: ["redis-server", "--loglevel", "warning", "--maxmemory", "${REDIS_MAXMEMORY:-200mb}", "--maxmemory-policy", "volatile-lru"]
    networks:
      instancia_net:
        ipv4_address: ${IP_REDIS}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_REDIS:-0.5}'
          memory: '${MEM_REDIS:-256M}'
        reservations:
          memory: '${RES_REDIS:-64M}'
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - './volumes/redis_data:/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  postgres:
    image: 'pgvector/pgvector:pg16'
    container_name: '${PREFIXO_CONTAINER}_db'
    command: ["postgres", "-c", "max_connections=250", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}", "-c", "work_mem=${POSTGRES_WORK_MEM:-8MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}", "-c", "max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-2}", "-c", "log_connections=off", "-c", "log_disconnections=off", "-c", "log_min_messages=warning"]
    networks:
      instancia_net:
        ipv4_address: ${IP_POSTGRES}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_DB:-1.0}'
          memory: '${MEM_DB:-1024M}'
        reservations:
          memory: '${RES_DB:-512M}'
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - './volumes/postgres_data:/var/lib/postgresql/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 30s
      timeout: 5s
      retries: 3

  nocodb:
    image: 'nocodb/nocodb:2026.07.0'
    container_name: '${PREFIXO_CONTAINER}_nocodb'
    networks:
      instancia_net:
        ipv4_address: ${IP_NOCODB}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_NOCODB:-0.5}'
          memory: '${MEM_NOCODB:-1024M}'
        reservations:
          memory: '${RES_NOCODB:-256M}'
    environment:
      - TZ=America/Sao_Paulo
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_DEFAULT:-768}
      - NC_DISABLE_TELE=true
      - NC_LOGGER_LEVEL=error
      - NC_CONNECT_TO_EXTERNAL_DB_DISABLED=true
      - NC_DB=pg://postgres:5432?u=${DB_USER}&p=${DB_PASSWORD}&d=${DB_NAME}&sslmode=disable&searchPath=nocodb_schema
      - NC_ADMIN_EMAIL=${TS_EMAIL}
      - NC_ADMIN_PASSWORD=${DB_PASSWORD}
      - NC_SESSION_EXPIRY=24h
      - NC_ALLOWED_IP_RANGES=private
      - NC_ALLOW_LOCAL_EXTERNAL_DBS=true
      - NC_DB_POOL_SIZE=20
    volumes:
      - './volumes/nocodb_data:/usr/app/data/'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  evolution:
    image: 'evoapicloud/evolution-api:v2.3.7'
    container_name: '${PREFIXO_CONTAINER}_evolution'
    networks:
      instancia_net:
        ipv4_address: ${IP_EVOLUTION}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_EVOLUTION:-1.0}'
          memory: '${MEM_EVOLUTION:-1024M}'
        reservations:
          memory: '${RES_EVOLUTION:-256M}'
    environment:
      - TZ=America/Sao_Paulo
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_DEFAULT:-768}
      - LOG_LEVEL=error
      - DEL_INSTANCE_TRACKER=true
      # [SRE DOC] Habilita as interfaces visuais de documentação da API
      - SWAGGER_ENABLED=true
      - DOCS_ENABLED=true
      - SERVER_URL=${SERVER_URL}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/evolution_db?schema=public&connection_limit=50
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - CACHE_PROVIDER=redis
      - CACHE_LOCAL_ENABLED=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://${IP_REDIS}:6379/0
    volumes:
      - './volumes/evolution_instances:/evolution/instances'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  pgbouncer:
    image: 'edoburu/pgbouncer:v1.25.2-p0'
    container_name: '${PREFIXO_CONTAINER}_pooler'
    networks:
      instancia_net:
        ipv4_address: ${IP_PGBOUNCER}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_POOLER:-0.2}'
          memory: '${MEM_POOLER:-256M}'
        reservations:
          memory: '${RES_POOLER:-64M}'
    environment:
      - TZ=America/Sao_Paulo
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - LOG_STATS=0
      - STATS_PERIOD=3600
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=*
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - POOL_MODE=transaction
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - "127.0.0.1:5432:6432/tcp"
    volumes:
      - ./pgbouncer_conf/pgbouncer-other-databases.ini:/etc/pgbouncer/pgbouncer-other-databases.ini:ro
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q '1920' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  n8n:
    image: 'n8nio/n8n:2.31.6'
    container_name: '${PREFIXO_CONTAINER}_n8n'
    networks:
      instancia_net:
        ipv4_address: ${IP_N8N}
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          node -e "fetch('http://localhost:5678/healthz').then(r => r.ok ? process.exit(0) : process.exit(1))" || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${CPU_N8N:-1.0}'
          memory: '${MEM_N8N:-1024M}'
        reservations:
          memory: '${RES_N8N:-256M}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_DEFAULT:-768}
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_METRICS_ENABLED=false
      - N8N_HIDE_USAGE_PAGE=true
      - N8N_SECURE_COOKIE=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      - DB_POSTGRESDB_SCHEMA=n8n_schema
      - DB_POSTGRESDB_POOL_MAX=50
      # [SRE DOC] Ativação obrigatória do servidor MCP nativo do n8n
      - N8N_MCP_ACCESS_ENABLED=true
      - TZ=America/Sao_Paulo
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      - OPENAI_API_BASE_URLS=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      # --- INTEGRAÇÃO BANCO DE DADOS PARA ARMAZENAMENTO DINÂMICO ---
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - X_LOJISTA_ID=${PREFIXO_CONTAINER}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=pgbouncer
      - DB_POSTGRESDB_PORT=6432
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - DB_POSTGRESDB_RETRY_ATTEMPTS=10
      - DB_POSTGRESDB_RETRY_TIMEOUT=3000
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=14
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - LOJA_API_KEY=${LOJA_API_KEY}
      - LOJA_APP_KEY=${LOJA_APP_KEY}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    volumes:
      - './volumes/n8n_data:/home/node/.n8n'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot:
    image: 'chatwoot/chatwoot:v4.16.0'
    container_name: '${PREFIXO_CONTAINER}_chatwoot'
    networks:
      instancia_net:
        ipv4_address: ${IP_CHATWOOT}
    restart: always
    command: ["sh", "-c", "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b 0.0.0.0"]
    deploy:
      resources:
        limits:
          cpus: '${CPU_CHATWOOT:-1.0}'
          memory: '${MEM_CHATWOOT:-2048M}'
        reservations:
          memory: '${RES_CHATWOOT:-512M}'
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/chatwoot_db?pool=30
      - DEFAULT_LOCALE=pt_BR
      - DISABLE_TELEMETRY=true
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL}
      - INSTALLATION_ENV=docker
      - LOG_LEVEL=error
      - NODE_ENV=production
      - POSTGRES_DATABASE=chatwoot_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${DB_USER}
      - RAILS_ENV=production
      - REDIS_URL=redis://${PREFIXO_CONTAINER}_redis:6379
      - RUBY_YJIT_ENABLE=1
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY}
      - TZ=America/Sao_Paulo
      - WEB_CONCURRENCY=${CHATWOOT_WEB_CONCURRENCY:-2}
      - SIDEKIQ_CONCURRENCY=${CHATWOOT_SIDEKIQ_CONCURRENCY:-10}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      - OPENAI_API_BASE_URLS=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      # --- INTEGRAÇÃO ARMAZENAMENTO S3 (MINIO SOBERANO OU CLOUD EXTERNA) ---
      - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-amazon}
      - AWS_REGION=${S3_REGION:-us-east-1}
      - AWS_EC2_METADATA_DISABLED=true
      - S3_BUCKET_NAME=${S3_CHATWOOT_BUCKET:-chatwoot}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${TS_EMAIL}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${DB_PASSWORD}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://${PREFIXO_CONTAINER}_minio:9000}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - './volumes/chatwoot_data:/app/storage'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postiz:
    image: 'ghcr.io/gitroomhq/postiz-app:v2.21.10'
    container_name: '${PREFIXO_CONTAINER}_postiz'
    networks:
      instancia_net:
        ipv4_address: ${IP_POSTIZ}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_POSTIZ:-2.0}'
          memory: '${MEM_POSTIZ:-4096M}'
        reservations:
          memory: '${RES_POSTIZ:-1024M}'
    environment:
      - TZ=America/Sao_Paulo
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_POSTIZ:-2048}
      - POSTIZ_FRONTEND_URL=${POSTIZ_FRONTEND_URL}
      - MAIN_URL=${MAIN_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}/api
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/postiz_db?connection_limit=30
      - REDIS_URL=redis://${IP_REDIS}:6379
      - REDIS_HOST=${PREFIXO_CONTAINER}_redis
      - REDIS_PORT=6379
      - JWT_SECRET=${POSTIZ_JWT_SECRET}
      - TEMPORAL_ADDRESS=${PREFIXO_CONTAINER}_temporal:7233
      - TEMPORAL_TLS=false
      - TEMPORAL_INSECURE=true
      - DISABLE_SEARCH_ATTRIBUTES=true
      - DISABLE_TEMPORAL_SEARCH_ATTRIBUTES=true
      - NODE_ENV=production
      - LOG_LEVEL=warn
      # --- INTEGRAÇÃO IA (NATIVA OU VIA LITELLM) ---
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      - OPENAI_API_BASE_URLS=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      # --- INTEGRAÇÃO ARMAZENAMENTO S3 (MINIO SOBERANO OU CLOUD EXTERNA) ---
      - STORAGE_PROVIDER=${POSTIZ_STORAGE_PROVIDER:-local}
      - UPLOAD_DIRECTORY=/app/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
      - S3_BUCKET_NAME=${S3_POSTIZ_BUCKET:-postiz}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${TS_EMAIL}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${DB_PASSWORD}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://${PREFIXO_CONTAINER}_minio:9000}
    volumes:
      - './volumes/postiz_data:/app/uploads'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/auth', (r) => process.exit(r.statusCode === 200 || r.statusCode === 307 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  temporal:
    image: 'temporalio/auto-setup:1.29.7'
    container_name: '${PREFIXO_CONTAINER}_temporal'
    restart: unless-stopped
    networks:
      instancia_net:
        ipv4_address: ${IP_TEMPORAL}
    ports:
      - "7233:7233"
    deploy:
      resources:
        limits:
          cpus: '${CPU_TEMPORAL:-0.5}'
          memory: '${MEM_TEMPORAL:-768M}'
        reservations:
          memory: '${RES_TEMPORAL:-128M}'
    environment:
      - TZ=America/Sao_Paulo
      - LOG_LEVEL=error
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PWD=${DB_PASSWORD}
      - DB_PORT_5432_TCP_ADDR=${IP_POSTGRES}
      - POSTGRES_SEEDS=${IP_POSTGRES}
      - POSTGRES_VISIBILITY_SEEDS=${IP_POSTGRES}
      - SKIP_SCHEMA_SETUP=false
      - SQL_MAX_CONNS=12
      - SQL_MAX_IDLE_CONNS=2
      - BIND_ON_IP=0.0.0.0
    volumes:
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i | awk '{print $$1}'):7233"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
  
  caddy:
    image: 'caddy:2.11.4-alpine'
    container_name: '${PREFIXO_CONTAINER}_waf'
    restart: unless-stopped
    networks:
      instancia_net:
        ipv4_address: ${IP_CADDY}
    ports:
      - "${PROXY_PORT:-80}:80/tcp"
      - "${EVO_PORT:-8081}:8081/tcp"
      - "3000:3000/tcp"  # Chatwoot
      - "3001:3001/tcp"  # Open WebUI (IA)
      - "4000:4000/tcp"  # LiteLLM (Gateway API)
      - "5678:5678/tcp"  # n8n
      - "${NOCO_PORT:-18080}:8080/tcp"  # NocoDB
      - "5000:5000/tcp"  # Postiz
      - "9000:9000/tcp"  # MinIO S3 API
      - "9001:9001/tcp"  # MinIO Console UI
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TZ=America/Sao_Paulo
      - LICENSING_SERVER=https://licencas.fornecedor.com.br
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile'
      - './core/html/index.html:/etc/caddy/index.html:ro'
      - './core/html/bg-daemind.jpg:/etc/caddy/bg-daemind.jpg:ro'
      - './core/html/favicon-daemind.png:/etc/caddy/favicon-daemind.png:ro'
      - './core/html/favicon.png:/etc/caddy/favicon.png:ro'
      - './volumes/caddy_data:/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    deploy:
      resources:
        limits:
          cpus: '${CPU_WAF:-0.5}'
          memory: '${MEM_WAF:-256M}'
        reservations:
          memory: '${RES_WAF:-64M}'

  litellm:
    image: 'ghcr.io/berriai/litellm:main-latest'
    container_name: '${PREFIXO_CONTAINER}_litellm'
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_NUM_WORKERS:-1}"]
    networks:
      instancia_net:
        ipv4_address: ${IP_LITELLM}
    deploy:
      resources:
        limits:
          cpus: '${CPU_LITELLM:-1.0}'
          memory: '${MEM_LITELLM:-2048M}'
        reservations:
          memory: '${RES_LITELLM:-256M}'
    environment:
    # - LITELLM_LOG=WARN
      - PYTHONUNBUFFERED=1 # Força a exibição instantânea de logs
      - TZ=America/Sao_Paulo
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${TS_EMAIL}
      - UI_PASSWORD=${DB_PASSWORD}
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      # Repassando chaves
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # --- INTEGRAÇÃO BANCO DE DADOS PARA ARMAZENAMENTO DINÂMICO ---
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/litellm_db
    volumes:
      - './volumes/litellm_data/config.yaml:/app/config.yaml:ro'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
  
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: '${PREFIXO_CONTAINER}_openwebui'
    networks:
      instancia_net:
        # Lembre-se de alterar IP_NEXTCHAT para IP_OPENWEBUI no seu .env
        ipv4_address: ${IP_OPENWEBUI}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_OPENWEBUI:-1.0}'
          memory: '${MEM_OPENWEBUI:-1024M}'
        reservations:
          memory: '${RES_OPENWEBUI:-512M}'
    environment:
      - TZ=America/Sao_Paulo
      # --- 1. INTEGRAÇÃO POSTGRESQL + PGVECTOR (Via PgBouncer) ---
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/openwebui_db
      
      # --- 2. INTEGRAÇÃO REDIS (Sessões e Rate Limit) ---
      # - ENABLE_WEBSOCKET_SUPPORT=True
      # - WEBSOCKET_MANAGER=redis
      # - WEBSOCKET_REDIS_URL=redis://${PREFIXO_CONTAINER}_redis:6379/3
      
      # --- 3. ROTEAMENTO DE IA (LiteLLM) ---
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE=http://${PREFIXO_CONTAINER}_litellm:4000/v1
      
      # --- 4. DEBLOAT & HARDENING (SRE) ---
      - ENABLE_IMAGE_GENERATION=False
      - ENABLE_PLUGINS=True # Mantido true apenas para o Admin usar Pipelines/n8n
      - ENABLE_COMMUNITY_SHARING=False
      - ENABLE_MESSAGE_RATING=False
      - ENABLE_EVALUATION_ARENA_MODELS=False
      - ENABLE_AUTOCOMPLETE_GENERATION=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_ADMIN_EXPORT=False
      - ENABLE_CONTEXT_COMPACTION=True # Comprime histórico para poupar tokens do OpenRouter
      # Bloqueia a criação de contas soltas (só admin aprova/cria usuários)
      # - ENABLE_SIGNUP=False
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}
      - RAG_EMBEDDING_ENGINE=openai
      - ENABLE_OLLAMA_API=False
      - OPENAI_API_BASE_URLS=http://${PREFIXO_CONTAINER}_litellm:4000/v1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - './volumes/openwebui_data:/app/backend/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'