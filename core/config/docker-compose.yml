networks:
  instancia_net:
    name: '${PREFIXO_CONTAINER}_net'
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-${PREFIXO_CONTAINER}
    ipam:
      config:
        - subnet: ${IP_NETWORK_SUBNET}

services:
  redis:
    # image: 'redis:7.4-alpine'
    image: 'redis:8.10-alpine'    
    container_name: '${PREFIXO_CONTAINER}_redis'
    command: [ "redis-server", "--protected-mode", "no", "--loglevel", "warning", "--maxmemory", "${REDIS_MAXMEMORY:-200mb}", "--maxmemory-policy", "volatile-lru" ]
    networks:
      instancia_net:
        ipv4_address: ${IP_REDIS}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_REDIS:-0.5}'
          memory: '${MEM_REDIS:-256M}'
        reservations:
          memory: '${RES_REDIS:-64M}'
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - './volumes/redis_data:/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    # image: 'pgvector/pgvector:pg16'
    image: 'pgvector/pgvector:pg17'
    container_name: '${PREFIXO_CONTAINER}_postgres'
    command: [ "postgres", "-c", "max_connections=250", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}", "-c", "work_mem=${POSTGRES_WORK_MEM:-8MB}", "-c", "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}", "-c", "max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-2}", "-c", "log_connections=off", "-c", "log_disconnections=off", "-c", "log_min_messages=warning" ]
    networks:
      instancia_net:
        ipv4_address: ${IP_POSTGRES}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_DB:-1.0}'
          memory: '${MEM_DB:-1024M}'
        reservations:
          memory: '${RES_DB:-512M}'
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - './volumes/postgres_data:/var/lib/postgresql/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 30s
      timeout: 5s
      retries: 3

  pgbouncer:
    image: 'edoburu/pgbouncer:v1.25.2-p0'
    container_name: '${PREFIXO_CONTAINER}_pgbouncer'
    networks:
      instancia_net:
        ipv4_address: ${IP_PGBOUNCER}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${CPU_POOLER:-0.2}'
          memory: '${MEM_POOLER:-256M}'
        reservations:
          memory: '${RES_POOLER:-64M}'
    environment:
      - TZ=America/Sao_Paulo
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - LOG_STATS=0
      - STATS_PERIOD=3600
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=*
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - POOL_MODE=transaction
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
    ports:
      - "127.0.0.1:5432:6432/tcp"
    volumes:
      - ./volumes/pgbouncer_data/pgbouncer-other-databases.ini:/etc/pgbouncer/pgbouncer-other-databases.ini:ro
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "cat /proc/net/tcp | grep -q '1920' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: 'caddy:2.11.4-alpine'
    container_name: '${PREFIXO_CONTAINER}_caddy'
    restart: unless-stopped
    networks:
      instancia_net:
        ipv4_address: ${IP_CADDY}
    ports:
      - "${PROXY_PORT:-80}:80/tcp"
      - "4000:4000/tcp" # LiteLLM (Gateway API)
    healthcheck:
      test: [ "CMD", "caddy", "version" ]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile'
      - './core/html:/etc/caddy/public:ro'
      - './volumes/caddy_data:/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    deploy:
      resources:
        limits:
          cpus: '${CPU_WAF:-0.5}'
          memory: '${MEM_WAF:-256M}'
        reservations:
          memory: '${RES_WAF:-64M}'

  litellm:
    image: 'ghcr.io/berriai/litellm:main-latest'
    container_name: '${PREFIXO_CONTAINER}_litellm'
    restart: unless-stopped
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_NUM_WORKERS:-1}", "--use_v2_migration_resolver" ]
    networks:
      instancia_net:
        ipv4_address: ${IP_LITELLM}
    deploy:
      resources:
        limits:
          cpus: '${CPU_LITELLM:-1.0}'
          memory: '${MEM_LITELLM:-2048M}'
        reservations:
          memory: '${RES_LITELLM:-256M}'
    environment:
      - LITELLM_LOG=ERROR
      - PYTHONUNBUFFERED=1 # Força a exibição instantânea de logs
      - TZ=America/Sao_Paulo
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${TS_EMAIL}
      - UI_PASSWORD=${DB_PASSWORD}
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      # Repassando chaves
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # --- INTEGRAÇÃO BANCO DE DADOS PARA ARMAZENAMENTO DINÂMICO ---
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/litellm_db
    volumes:
      - './volumes/litellm_data/config.yaml:/app/config.yaml:ro'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
