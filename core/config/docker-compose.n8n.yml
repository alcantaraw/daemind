services:
  caddy:
    ports:
      - "5678:5678/tcp"

  n8n:
    image: 'n8nio/n8n:latest'
    container_name: '${PREFIXO_CONTAINER}_n8n'
    networks:
      instancia_net:
        ipv4_address: ${IP_N8N}
        aliases:
          - n8n
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          node -e "fetch('http://localhost:5678/healthz').then(r => r.ok ? process.exit(0) : process.exit(1))" || exit 1
      interval: 15s
      timeout: 10s
      retries: 3
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${CPU_N8N:-1.0}'
          memory: '${MEM_N8N:-2048M}'
        reservations:
          memory: '${RES_N8N:-256M}'
    extra_hosts:
      host.docker.internal: host-gateway
    environment:
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_DEFAULT:-1536} --no-deprecation
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_METRICS_ENABLED=false
      - N8N_HIDE_USAGE_PAGE=true
      - N8N_SECURE_COOKIE=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_RUNNERS_TASK_TIMEOUT=60
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      - N8N_LOG_LEVEL=error
      - N8N_DISABLED_MODULES=${N8N_DISABLED_MODULES:-instance-ai}
      - DB_POSTGRESDB_SCHEMA=n8n_schema
      - DB_POSTGRESDB_POOL_MAX=50
      ## [SRE DOC] Ativação obrigatória do servidor MCP nativo do n8n
      - N8N_MCP_ACCESS_ENABLED=true
      - TZ=America/Sao_Paulo
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE=http://litellm:4000/v1
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_BASE_URL=http://litellm:4000/v1
      ## --- INTEGRAÇÃO BANCO DE DADOS PARA ARMAZENAMENTO DINÂMICO ---
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - X_LOJISTA_ID=${PREFIXO_CONTAINER}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=pgbouncer
      - DB_POSTGRESDB_PORT=6432
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      - DB_POSTGRESDB_RETRY_ATTEMPTS=10
      - DB_POSTGRESDB_RETRY_TIMEOUT=3000

      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=14
      - LOJA_API_KEY=${LOJA_API_KEY}
      - LOJA_APP_KEY=${LOJA_APP_KEY}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}

      ## --- SERVICE MESH INTEGRATION (DAEMIND INTER-SERVICE BUS) ---
      - DOCLING_API_URL=http://${PREFIXO_CONTAINER}_docling:5001
      - SHLINK_API_URL=http://${PREFIXO_CONTAINER}_shlink:8080
      - SHLINK_API_KEY=${SHLINK_API_KEY:-${DB_PASSWORD}}
      - EVOLUTION_API_URL=http://${PREFIXO_CONTAINER}_evolution:8080
      - CHATWOOT_API_URL=http://${PREFIXO_CONTAINER}_chatwoot:3000
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN:-${DB_PASSWORD}}
      - LISTMONK_API_URL=http://${PREFIXO_CONTAINER}_listmonk:9000
      - POSTIZ_API_URL=http://${PREFIXO_CONTAINER}_postiz:5000

      ## --- S3 / MINIO OBJECT STORAGE (PADRÃO CHATWOOT / POSTIZ) ---
      - MINIO_ENDPOINT=http://s3minio:9000
      - MINIO_ACCESS_KEY=${S3_ACCESS_KEY_ID:-${TS_EMAIL}}
      - MINIO_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-${DB_PASSWORD}}
      - S3_ENDPOINT=http://s3minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${TS_EMAIL}}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${DB_PASSWORD}}
      - S3_BUCKET_NAME=${S3_N8N_BUCKET:-n8n}
      - STORAGE_ENDPOINT=http://s3minio:9000
      - STORAGE_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${TS_EMAIL}}
      - STORAGE_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${DB_PASSWORD}}
      - STORAGE_BUCKET_NAME=${S3_N8N_BUCKET:-n8n}
      - AWS_REGION=us-east-1
      ## --- N8N AI ASSISTANT DEV CAPABILITIES (ATIVADO VIA N8N_DEV_AI_ASSISTANT=s) ---
      # - N8N_INSTANCE_AI_MODEL_URL=http://litellm:4000/v1
      # - N8N_INSTANCE_AI_MODEL_API_KEY=${LITELLM_MASTER_KEY}
      # - N8N_INSTANCE_AI_MODEL=gpt-4.1
      # - N8N_INSTANCE_AI_SEARXNG_URL=http://searxng:8080
      # - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      # - N8N_SANDBOX_SERVICE_URL=http://n8n_sandbox:8080
      # - N8N_SANDBOX_SERVICE_API_KEY=${LITELLM_MASTER_KEY}
      # - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
    volumes:
      - './volumes/n8n_data:/home/node/.n8n'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
