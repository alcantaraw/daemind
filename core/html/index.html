<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daemind. | Infraestrutura Autônoma</title>
    <link rel="icon" type="image/png" href="favicon.png?v=3">

    <style>
        :root {
            --bg-overlay: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(30, 41, 59, 0.4);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-border-hover: rgba(56, 189, 248, 0.4);
            --accent-cyan: #00f0ff;
            --accent-violet: #a855f7;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050b14;
            background-image: url('bg-daemind.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(5, 11, 20, 0.8) 100%),
                linear-gradient(to bottom, rgba(5, 11, 20, 0.6) 0%, rgba(5, 11, 20, 0.9) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            padding: 2rem 1.5rem;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.4rem;
        }

        .brand img {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.3));
        }

        .brand h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.1rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.15rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 195px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--card-border-hover);
            box-shadow: 0 8px 24px -6px rgba(0, 240, 255, 0.18);
            background: rgba(30, 41, 59, 0.65);
        }

        .card:hover::before {
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .icon {
            font-size: 1.4rem;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }

        .card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .card p.description {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 0.9rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-tertiary);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.65rem;
        }

        .port {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.06);
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 600;
        }

        .footer-note {
            text-align: center;
            margin-top: 2.5rem;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            padding: 4px 12px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.1);
            font-size: 0.75rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .brand h1 {
                font-size: 1.8rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <img src="favicon-daemind.png" alt="daemind.">
                <h1>daemind.</h1>
            </div>
            <p class="subtitle">Sistema Operacional Autônomo para Negócios Digitais</p>
        </header>

        <div class="grid">
        </div>

        <div class="footer-note">
            <div class="secure-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Tráfego Criptografado (Tailscale Mesh)
            </div>
            <span>daemind SRE Engine • Monitoramento Ativo</span>
        </div>
    </div>

    <script>
        document.querySelectorAll('.dynamic-link').forEach(link => {
            const port = link.getAttribute('data-port');
            const path = link.getAttribute('data-path') || '';
            const protocol = link.getAttribute('data-protocol') || 'http';
            link.href = protocol + '://' + window.location.hostname + ':' + port + path;
        });
    </script>
</body>

</html>
