<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d7e34"/>
      <stop offset="50%" stop-color="#2c5723"/>
      <stop offset="100%" stop-color="#1b3b14"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="grad-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Anel Externo Dourado -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#grad-gold)" stroke-width="8" stroke-dasharray="12 6" opacity="0.8"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#grad-gold)" stroke-width="4"/>

  <!-- Fundo Circular Verde Campo Profundo -->
  <circle cx="250" cy="250" r="205" fill="url(#grad-green)" stroke="#22c55e" stroke-width="3"/>

  <!-- Sol Nascente do Agronegócio -->
  <g id="sun" filter="url(#glow)">
    <circle cx="250" cy="210" r="65" fill="url(#grad-gold)"/>
    <!-- Raios do Sol -->
    <path d="M250 110 L250 135" stroke="url(#grad-gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M175 140 L195 160" stroke="url(#grad-gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M325 140 L305 160" stroke="url(#grad-gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M125 210 L155 210" stroke="url(#grad-gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M375 210 L345 210" stroke="url(#grad-gold)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Colinas e Linhas de Plantio -->
  <path d="M60 300 Q150 250 250 280 T440 300 L440 390 Q340 430 250 430 Q160 430 60 390 Z" fill="#1b3b14" opacity="0.9"/>
  <path d="M70 330 Q160 290 250 315 T430 330 L430 400 Q340 440 250 440 Q160 440 70 400 Z" fill="#28561d" opacity="0.85"/>
  <path d="M85 365 Q170 335 250 355 T415 365 L415 420 Q330 450 250 450 Q170 450 85 420 Z" fill="#367426" opacity="0.8"/>

  <!-- Espiga de Trigo Estilizada (Direita) -->
  <g id="wheat" fill="url(#grad-gold)" stroke="#92400e" stroke-width="1.5">
    <path d="M275 270 Q285 240 315 230 Q300 260 275 270 Z"/>
    <path d="M280 250 Q310 225 340 220 Q320 250 280 250 Z"/>
    <path d="M285 225 Q325 200 355 200 Q335 230 285 225 Z"/>
    <path d="M290 200 Q335 175 365 180 Q340 210 290 200 Z"/>
    <path d="M285 175 Q325 150 350 155 Q330 185 285 175 Z"/>
    <!-- Haste central da espiga -->
    <path d="M265 295 Q285 220 335 150" fill="none" stroke="url(#grad-gold)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Folha Verde Broto Germinando (Esquerda) -->
  <g id="leaf">
    <path d="M245 285 Q160 260 140 180 Q210 185 245 285 Z" fill="url(#grad-leaf)" stroke="#14532d" stroke-width="2"/>
    <!-- Nervura da Folha -->
    <path d="M245 285 Q195 230 155 195" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
    <!-- Broto Secundário -->
    <path d="M235 295 Q180 300 170 255 Q215 250 235 295 Z" fill="url(#grad-leaf)" opacity="0.9" stroke="#14532d" stroke-width="1.5"/>
  </g>

  <!-- Faixa Inferior de Marca -->
  <path d="M100 385 L400 385 Q410 385 415 395 L405 435 Q400 445 390 445 L110 445 Q100 445 95 435 L85 395 Q90 385 100 385 Z" fill="#0f2610" stroke="url(#grad-gold)" stroke-width="3"/>
  <text x="250" y="420" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AGROLAGOS</text>
  <text x="250" y="438" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">SHOPPING RURAL</text>
</svg>
